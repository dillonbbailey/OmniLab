[project]
name = "omnilab"
version = "0.1.0"
description = "A Qt USD editor with an isolated NVIDIA ovRTX viewport"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6-Essentials==6.8.3",
    "usd-core==26.8",
    "numpy==2.2.6",
    "pillow==12.1.1",
]

[project.optional-dependencies]
rtx = ["ovrtx==0.5.0.377615", "ovstage==0.2.0.377349"]
dev = ["pytest==8.4.2"]

[project.scripts]
omnilab = "omnilab.app:main"
omnilab-probe = "omnilab.probe:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnilab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a supported NVIDIA RTX GPU and the pinned runtime"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
